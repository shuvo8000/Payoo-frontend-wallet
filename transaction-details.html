<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payoo - Transaction Details</title>
    <link rel="stylesheet" href="style.css">

    <style>
        .details-page {
            max-width: 900px;
        }

        .details-card h2 {
            margin-top: 0;
        }
    </style>
</head>

<body>
<div class="app-shell">

    <aside class="sidebar">
        <a class="brand" href="dashboard.html">
            <span class="brand-mark">P</span>
            Payoo
        </a>

        <nav class="nav">
            <a href="dashboard.html" data-nav="dashboard"><span>⌂</span>Dashboard</a>
            <a href="add-money.html" data-nav="add-money"><span>+</span>Add Money</a>
            <a href="send-money.html" data-nav="send-money"><span>↗</span>Send Money</a>
            <a href="cash-out.html" data-nav="cash-out"><span>↓</span>Cash Out</a>
            <a href="mobile-recharge.html" data-nav="mobile-recharge"><span>▣</span>Mobile Recharge</a>
            <a href="pay-bill.html" data-nav="pay-bill"><span>◫</span>Pay Bill</a>
            <a href="transactions.html" data-nav="transactions"><span>≡</span>Transactions</a>
            <a href="ai-assistant.html" data-nav="ai-assistant"><span>✦</span>AI Assistant</a>
            <a href="profile.html" data-nav="profile"><span>●</span>Profile</a>
        </nav>

        <div class="sidebar-bottom">
            <button class="nav" data-logout>
                <span>↪</span>
                Logout
            </button>
        </div>
    </aside>

    <main class="main">

        <header class="topbar">
            <div class="top-title">
                <div class="page-title">
                    <h1>Transaction Details</h1>
                    <p>View transaction information</p>
                </div>
            </div>

            <div class="user-chip">
                <div>
                    <strong data-user-name></strong>
                    <small class="muted block" data-user-mobile></small>
                </div>

                <div class="avatar" data-avatar></div>
            </div>
        </header>

        <section class="content details-page">
            <div id="details" class="card details-card"></div>
        </section>

    </main>
</div>

<script src="js/storage.js"></script>
<script src="js/common.js"></script>
<script src="js/details.js"></script>
</body>
</html>
